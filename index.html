<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />

    <title>Offtracq — Cinematic Travel & Adventure Films</title>
    <meta
      name="description"
      content="Offtracq is a cinematic travel and adventure film series — hiking, kayaking, off-roading and via ferrata, plus stories of Native America, hidden towns and the people who built them."
    />
    <link rel="canonical" href="https://offtracq.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Offtracq" />
    <meta property="og:title" content="Offtracq — Cinematic Travel & Adventure Films" />
    <meta
      property="og:description"
      content="Cinematic travel and adventure films — hiking, kayaking, off-roading, via ferrata, and stories of Native America and hidden places worth going off the beaten path for."
    />
    <meta property="og:url" content="https://offtracq.com/" />
    <meta property="og:image" content="https://offtracq.com/images/hero.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Offtracq — Cinematic Travel & Adventure Films" />
    <meta
      name="twitter:description"
      content="Cinematic travel and adventure films — hiking, kayaking, off-roading, via ferrata, and stories of Native America and hidden places worth going off the beaten path for."
    />
    <meta name="twitter:image" content="https://offtracq.com/images/hero.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preload" as="image" href="/images/hero.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Decodes the redirect from 404.html (see comment there) back into a
      // real path before React Router mounts, so a direct load of e.g.
      // /blog resolves correctly on static hosting like GitHub Pages.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
